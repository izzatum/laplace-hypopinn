name: tests

on: [push, pull_request]

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU reference environment
        run: |
          python -m pip install --upgrade pip 'setuptools>=68' wheel
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' -e '.[dev,plot,fast-marching,notebooks]'
          python -m ipykernel install --user --name laplace-hypopinn
      - name: Lint maintained code
        run: python -m ruff check .
      - name: Test scientific contracts, archive, plots, and isolated wheel
        run: python -m pytest -q
      - name: Execute maintained tutorial notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          paths = sorted(Path("examples/notebooks").glob("*.ipynb"))
          assert paths, "No tutorial notebooks found"
          for path in paths:
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              NotebookClient(
                  notebook, timeout=300, kernel_name="laplace-hypopinn",
                  resources={"metadata": {"path": str(path.parent.resolve())}},
                  record_timing=False,
              ).execute()
              print(f"Executed {path}", flush=True)
          PY
      - name: Build source and wheel distributions
        run: python -m build
